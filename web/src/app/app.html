<main class="page">
  <header>
    <h1>Money Waste</h1>
    <p class="tagline">Registre o gasto agora. Descubra para onde o dinheiro vai depois.</p>
  </header>

  <section class="card" aria-labelledby="expense-form-title">
    <app-expense-form #form (created)="refreshMonth()" (updated)="refreshMonth()" />
  </section>

  <section class="card" aria-label="Total do mês">
    <app-expense-total />
    <app-month-comparison />
  </section>

  <section class="card" aria-labelledby="category-totals-title">
    <h2 id="category-totals-title">Gastos por categoria</h2>
    <app-category-totals />
  </section>

  <section class="card" aria-labelledby="month-expenses-title">
    <h2 id="month-expenses-title">Gastos do mês</h2>
    <app-expense-list (edit)="form.startEdit($event)" (deleted)="refreshMonth()" />
  </section>
</main>
