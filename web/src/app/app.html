<main class="page">
  <header>
    <h1>Money Waste</h1>
    <p class="tagline">Registre o gasto agora. Descubra para onde o dinheiro vai depois.</p>
  </header>

  <section class="card" aria-labelledby="new-expense-title">
    <h2 id="new-expense-title">Novo gasto</h2>
    <app-expense-form (created)="total.reload(); list.reload()" />
  </section>

  <section class="card" aria-label="Total do mês">
    <app-expense-total #total />
  </section>

  <section class="card" aria-labelledby="month-expenses-title">
    <h2 id="month-expenses-title">Gastos do mês</h2>
    <app-expense-list #list />
  </section>
</main>
